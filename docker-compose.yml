services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: railway
      POSTGRES_PASSWORD: ${DB_PASSWORD:-railway_dev_password}
      POSTGRES_DB: railway
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railway -d railway"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://railway:${DB_PASSWORD:-railway_dev_password}@db:5432/railway
      GTFS_API_KEY: ${GTFS_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app:ro
      - ./data:/data:ro
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    environment:
      API_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/static:/app/static:ro

volumes:
  postgres_data:
